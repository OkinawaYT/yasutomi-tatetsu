<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-8 space-y-6">

  <!-- Loading -->
  <div id="s-loading" class="text-center py-24">
    <div class="inline-block w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-slate-500 text-sm">読み込み中...</p>
  </div>

  <!-- Error -->
  <div id="s-error" class="hidden bg-red-50 border border-red-200 rounded-2xl p-6">
    <p class="font-bold text-red-700 mb-1">エラー</p>
    <p id="error-msg" class="text-red-600 text-sm"></p>
  </div>

  <!-- Main -->
  <div id="s-main" class="hidden space-y-6">

    <!-- Header -->
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold text-slate-800">Q&amp;A ダッシュボード</h1>
        <p class="text-sm text-slate-400 mt-1">質問・回答の集計</p>
      </div>
      <button id="btn-refresh" onclick="refreshData()"
        class="text-xs text-slate-500 hover:text-indigo-600 border border-slate-200 hover:border-indigo-300 rounded-lg px-3 py-2 transition">
        ↻ 更新
      </button>
    </div>

    <!-- Filter bar -->
    <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
      <div class="flex flex-wrap gap-3 items-center">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">絞り込み</span>

        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400">セミナー</label>
          <select id="filter-session" onchange="onSessionChange()"
            class="text-sm border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-300">
          </select>
        </div>

        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400">設問</label>
          <select id="filter-pair" onchange="applyFilter()"
            class="text-sm border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-300 max-w-[240px]">
            <option value="">全設問</option>
          </select>
        </div>

        <div class="flex items-center gap-2 ml-auto">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="search-input" type="text" placeholder="キーワード検索..."
            oninput="onSearch()"
            class="text-sm border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-indigo-300 w-40">
        </div>

        <span id="filter-count" class="text-xs text-slate-400"></span>
      </div>
    </div>

    <!-- Stats -->
    <div id="el-stats" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

    <!-- Q&A tables -->
    <div id="el-qa" class="space-y-4"></div>
    <p id="el-qa-empty" class="hidden text-sm text-slate-400 text-center py-6">該当するデータがありません</p>

    <p id="el-updated" class="text-xs text-slate-400 text-right"></p>

  </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
let GAS_URL    = '';
let qaSessions = [];
let allRows    = [];
let allPairs   = [];
let searchQuery = '';
let isRefreshing = false;

// ============================================================
// INIT
// ============================================================
async function init() {
  const params = new URLSearchParams(location.search);
  const preferredSheet = params.get('sheet') || '';

  try {
    const r = await fetch('config.json');
    if (r.ok) {
      const cfg = await r.json();
      if (cfg.gas_url && cfg.gas_url !== 'YOUR_GAS_URL_HERE') GAS_URL = cfg.gas_url;
      qaSessions = cfg.qa_sessions || [];
    }
  } catch (_) {}

  if (!GAS_URL) {
    showError('config.json の gas_url が設定されていません。');
    return;
  }
  if (!qaSessions.length) {
    showError('config.json に qa_sessions が設定されていません。');
    return;
  }

  const sel = el('filter-session');
  qaSessions.forEach(s => sel.appendChild(new Option(s.title, s.sheet)));

  if (preferredSheet && qaSessions.some(s => s.sheet === preferredSheet)) {
    sel.value = preferredSheet;
  }

  hide('s-loading');
  show('s-main');
  await loadSession(sel.value, true);
}

// ============================================================
// DATA LOAD
// ============================================================
async function onSessionChange() {
  await loadSession(el('filter-session').value, false, true);
}

async function loadSession(sheetName, autoFallback = false, forceFetch = false) {
  allRows  = [];
  allPairs = [];
  el('el-qa').innerHTML    = '';
  el('el-stats').innerHTML = '';
  el('filter-count').textContent = '';

  const pairSel = el('filter-pair');
  pairSel.innerHTML = '<option value="">全設問</option>';

  if (!sheetName) return;

  try {
    let result = await fetchQaResults(sheetName, forceFetch);

    if (autoFallback && !(result.rows || []).length) {
      for (const s of qaSessions) {
        if (s.sheet === sheetName) continue;
        const alt = await fetchQaResults(s.sheet, forceFetch);
        if ((alt.rows || []).length) {
          sheetName = s.sheet;
          el('filter-session').value = sheetName;
          result = alt;
          break;
        }
      }
    }

    allRows  = result.rows  || [];
    allPairs = result.pairs || [];
  } catch (e) {
    showError(`データ取得失敗：${e.message}`);
    return;
  }

  el('el-updated').textContent = `最終更新：${new Date().toLocaleString('ja-JP')}`;

  allPairs.forEach((p, i) => {
    pairSel.appendChild(new Option(`Q${i + 1}　${p.q_col}`, p.q_col));
  });

  applyFilter();
}

async function refreshData() {
  if (isRefreshing) return;

  isRefreshing = true;
  const btn = el('btn-refresh');
  if (btn) {
    btn.disabled = true;
    btn.classList.add('opacity-60', 'cursor-not-allowed');
    btn.textContent = '更新中...';
  }

  hide('s-error');
  show('s-main');

  try {
    await loadSession(el('filter-session').value, true, true);
  } finally {
    isRefreshing = false;
    if (btn) {
      btn.disabled = false;
      btn.classList.remove('opacity-60', 'cursor-not-allowed');
      btn.textContent = '↻ 更新';
    }
  }
}

async function fetchQaResults(sheetName, forceFetch = false) {
  const nonce = forceFetch ? `&_ts=${Date.now()}` : '';
  const result = await fetchJsonp(
    `${GAS_URL}?action=getQaResults&sheet_name=${encodeURIComponent(sheetName)}${nonce}`
  );

  // GAS 側で QA ルートが未反映だと status/message だけ返るため、明示的にエラー扱いにする。
  if (!result || (!Array.isArray(result.rows) && !Array.isArray(result.pairs))) {
    throw new Error('QAデータ形式の応答ではありません。GASのWebアプリURLまたはデプロイ内容を確認してください。');
  }

  return result;
}

// ============================================================
// FILTER
// ============================================================
function applyFilter() {
  const pairVal = el('filter-pair').value;

  let rows = allRows;
  if (searchQuery) {
    rows = rows.filter(r =>
      Object.values(r).some(v => String(v).toLowerCase().includes(searchQuery))
    );
  }

  const pairs = pairVal ? allPairs.filter(p => p.q_col === pairVal) : allPairs;

  el('filter-count').textContent = `${rows.length} 件表示中`;
  renderStats(rows, pairs);
  renderQA(rows, pairs);
}

function onSearch() {
  searchQuery = el('search-input').value.trim().toLowerCase();
  applyFilter();
}

// ============================================================
// RENDER
// ============================================================
function renderStats(rows, pairs) {
  el('el-stats').innerHTML = [
    { label: '総回答数', value: rows.length,  color: 'bg-indigo-50 border-indigo-100 text-indigo-700' },
    { label: '設問数',   value: pairs.length, color: 'bg-slate-50 border-slate-100 text-slate-700' },
  ].map(c => `
    <div class="${c.color} rounded-2xl border p-4 shadow-sm">
      <div class="text-3xl font-bold">${c.value}</div>
      <div class="text-xs mt-1 opacity-60">${c.label}</div>
    </div>`).join('');
}

function highlight(text) {
  if (!searchQuery) return esc(text);
  const lower = text.toLowerCase();
  let result = '', pos = 0, idx;
  while ((idx = lower.indexOf(searchQuery, pos)) >= 0) {
    result += esc(text.slice(pos, idx));
    result += `<mark class="bg-yellow-200 rounded">${esc(text.slice(idx, idx + searchQuery.length))}</mark>`;
    pos = idx + searchQuery.length;
  }
  return result + esc(text.slice(pos));
}

function renderQA(rows, pairs) {
  const container = el('el-qa');
  container.innerHTML = '';
  let hasData = false;

  pairs.forEach((pair, i) => {
    const responses = rows
      .map(r => ({
        question: (r[pair.q_col] || '').trim(),
        answer:   (r[pair.a_col] || '').trim(),
      }))
      .filter(r => r.question || r.answer);

    if (!responses.length) return;
    hasData = true;

    const div = document.createElement('div');
    div.className = 'bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden';
    div.innerHTML = `
      <div class="bg-slate-50 border-b border-slate-100 px-4 py-3 flex items-center justify-between">
        <p class="text-xs font-semibold text-slate-600">
          Q${i + 1}　<span class="text-indigo-600">${esc(pair.q_col)}</span>
          <span class="text-slate-300 mx-1">→</span>
          ${esc(pair.a_col)}
        </p>
        <span class="text-xs text-slate-400">${responses.length} 件</span>
      </div>
      <div class="overflow-x-auto max-h-[480px] overflow-y-auto">
        <table class="w-full text-xs">
          <thead class="bg-slate-50 border-b border-slate-100 sticky top-0">
            <tr>
              <th class="px-3 py-2 text-left font-semibold text-slate-500 w-1/2">${esc(pair.q_col)}</th>
              <th class="px-3 py-2 text-left font-semibold text-slate-500 w-1/2">${esc(pair.a_col)}</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${responses.map(r => `
              <tr class="hover:bg-slate-50 transition-colors">
                <td class="px-3 py-2.5 text-slate-600 whitespace-pre-wrap break-words align-top">${highlight(r.question)}</td>
                <td class="px-3 py-2.5 text-slate-700 whitespace-pre-wrap break-words align-top">${highlight(r.answer)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    container.appendChild(div);
  });

  el('el-qa-empty').classList.toggle('hidden', hasData || rows.length > 0);
}

// ============================================================
// JSONP
// ============================================================
function fetchJsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = `_jsonp_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const timeout = setTimeout(() => {
      delete window[cb];
      reject(new Error('タイムアウト（10秒）'));
    }, 10000);

    window[cb] = data => {
      clearTimeout(timeout);
      delete window[cb];
      document.head.removeChild(script);
      resolve(data);
    };

    const script = document.createElement('script');
    script.src = `${url}&callback=${cb}`;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cb];
      reject(new Error('スクリプト読み込みエラー'));
    };
    document.head.appendChild(script);
  });
}

// ============================================================
// UTILITIES
// ============================================================
function el(id)   { return document.getElementById(id); }
function show(id) { el(id).classList.remove('hidden'); }
function hide(id) { el(id).classList.add('hidden'); }
function esc(s)   { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showError(msg) {
  hide('s-loading');
  show('s-error');
  el('error-msg').textContent = msg;
}

init();
</script>
</body>
</html>
