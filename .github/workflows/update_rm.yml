name: Sync Researchmap Data

on:
  schedule:
    - cron: '0 16 * * 6'   # 毎週日曜 AM1:00 JST (= 土曜 UTC 16:00)
  workflow_dispatch:         # 手動実行可
  push:
    paths:
      - 'researchmap/imports/*.jsonl'   # 手動エクスポートを置いたら自動反映

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Rebuild researchmap data
        run: |
          if ls researchmap/imports/*.jsonl >/dev/null 2>&1; then
            echo "Found manual export under researchmap/imports/ — using it."
            uv run researchmap/src/loadFromExport.py
          else
            echo "No manual export found — fetching from Researchmap API."
            uv run researchmap/src/getResearchmapData.py
          fi

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync Researchmap data"
          file_pattern: 'data/*.json'
